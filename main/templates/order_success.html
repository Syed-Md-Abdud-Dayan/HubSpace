<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful - HubSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                  url("https://images.pexels.com/photos/9072379/pexels-photo-9072379.jpeg") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .success-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #f9ab55;
    }
    p, h4 {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    ul {
      text-align: left;
      margin-bottom: 30px; /* more spacing after items */
    }
    .list-group-item {
      background: rgba(255, 255, 255, 0.9);
      color: black;
      border: none;
      margin-bottom: 5px;
      border-radius: 8px;
    }
    .btn-home {
      background-color: #f9ab55;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 20px; /* ensures extra space above button */
      display: inline-block;
    }
    .btn-home:hover {
      background-color: #e38c2c;
      color: white;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <h1>✅ Order Placed Successfully!</h1>
    <p>Your PC number is: <strong>{{ pc_number }}</strong></p>

    <h4>Your Items:</h4>
    <ul class="list-group">
      {% for item in items %}
      <li class="list-group-item">{{ item }}</li>
      {% endfor %}
    </ul>

    <a href="/menu" class="btn-home">Back to Menu</a>
  </div>
</body>
</html>
