<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Failed - HubSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                        url("https://images.pexels.com/photos/9072379/pexels-photo-9072379.jpeg") center center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .error-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ff4c4c; /* red for error */
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .btn-home {
            background-color: #ff4c4c;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            text-decoration: none;
        }
        .btn-home:hover {
            background-color: #cc0000;
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>⚠ Booking Failed</h1>
        <p>{{ message }}</p>
        <a href="/" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
