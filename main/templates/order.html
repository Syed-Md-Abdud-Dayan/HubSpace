<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Your Order - HubSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                  url("https://images.pexels.com/photos/9072379/pexels-photo-9072379.jpeg") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .order-box {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #f9ab55;
      text-align: center;
    }
    h4, h5 {
      color: #f9ab55;
    }
    .btn-warning {
      background-color: #f9ab55;
      border: none;
    }
    .btn-warning:hover {
      background-color: #e38c2c;
    }
  </style>
</head>
<body>

  <div class="order-box">
    <h1>Complete Your Order</h1>

    <form method="POST" action="/submit_order" id="order-form">
      <!-- PC Number Input -->
      <div class="mb-3">
        <label for="pc_number" class="form-label">Enter Your PC Number:</label>
        <input type="text" name="pc_number" id="pc_number" class="form-control" required placeholder="e.g. ALPHA1">
      </div>

      <!-- Selected Items -->
      <h4 class="mt-4">Your Selected Items:</h4>
      <ul id="selected-items-list" class="list-group mb-3 text-dark"></ul>

      <!-- Total Amount -->
      <h5>Total Amount: ৳<span id="total-amount">0.00</span></h5>

      <!-- Hidden inputs for backend -->
      <input type="hidden" name="selected_items" id="selected_items">
      <input type="hidden" name="total_amount" id="total_amount_input">

      <button type="submit" id="confirm-pay-btn" class="btn btn-warning w-100 fw-bold mt-3">
        Confirm & Pay
      </button>
    </form>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const selectedItems = JSON.parse(localStorage.getItem("selectedItems")) || [];
    const list = document.getElementById("selected-items-list");
    const hiddenInput = document.getElementById("selected_items");
    const totalAmountSpan = document.getElementById("total-amount");
    const totalAmountInput = document.getElementById("total_amount_input");

    let total = 0;

    if(selectedItems.length === 0){
      list.innerHTML = '<li class="list-group-item text-dark">No items selected.</li>';
    } else {
      selectedItems.forEach(item => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = `${item.name} - ৳${item.price}`;
        total += parseFloat(item.price);
        list.appendChild(li);
      });
    }

    // Display total
    totalAmountSpan.textContent = total.toFixed(2);
    totalAmountInput.value = total.toFixed(2);

    // Save only item names for backend
    hiddenInput.value = selectedItems.map(i => i.name).join(",");

    // Prevent submission if no items
    const form = document.getElementById("order-form");
    form.addEventListener("submit", function(e){
      if(total === 0){
        e.preventDefault();
        alert("No items selected!");
        return;
      }
    });
  });
  </script>

</body>
</html>
